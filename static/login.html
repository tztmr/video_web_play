<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>登录 · TACO小剧场</title><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/account.css"><script type="module" src="/static/login.js"></script></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/"><img src="/static/icon.svg" alt=""><span>TACO<span class="brand-sub">小剧场</span></span></a><h1 id="auth-title">欢迎回来</h1><p id="auth-description">登录你的小剧场，接着上次的故事。</p><form id="auth-form"><label class="form-field">账号<input id="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" placeholder="字母、数字或下划线"></label><label class="form-field">密码<input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="至少 10 位"></label><label class="form-field" id="confirm-field" hidden>确认密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><button class="primary" id="submit-auth" type="submit">登录小剧场 →</button><p id="auth-error" class="form-error" role="alert"></p></form><p class="auth-footer" id="auth-footer">账号由管理员创建。分享链接可直接观看指定短剧。</p></main></body></html>
