<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>管理中心 · TACO小剧场</title><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/account.css"><script type="module" src="/static/admin.js"></script></head><body><main class="admin-main"><header class="admin-header"><div><h1>TACO小剧场 · 管理中心</h1><p>管理观众账号和短剧分享链接。</p></div><a href="/">← 返回剧场</a></header><p id="admin-message" class="form-error" role="status"></p><section class="admin-panel"><h2>观众账号</h2><p>账号登录后可浏览和观看全站短剧。停用账号或重置密码会立即使原登录失效。</p><form id="new-user" class="inline-form"><label class="form-field">账号<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" autocomplete="off" placeholder="字母、数字、下划线"></label><label class="form-field">初始密码<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="至少 10 位"></label><button class="primary" type="submit">创建观众账号</button></form><div class="table-scroll"><table><thead><tr><th>账号</th><th>角色</th><th>状态</th><th>操作</th><th>重置密码</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="admin-panel"><div class="section-tools"><h2>分享链接</h2><button id="reload-shares" class="text-button">刷新</button></div><p>在剧场打开一部短剧，在视频下方设置天数并生成链接，0 天表示永久有效。访客免登录观看这一部，链接到期或撤销后将拒绝后续视频请求。</p><div class="table-scroll"><table><thead><tr><th>短剧</th><th>有效期至</th><th>状态</th><th>操作</th></tr></thead><tbody id="shares"></tbody></table></div><div id="copy-result" class="share-result" hidden><input class="field-input" readonly aria-label="分享链接"><button class="secondary" id="copy-again">复制</button></div></section><footer class="geo-footer"><a class="geo-credit" href="https://db-ip.com" target="_blank" rel="noopener noreferrer">IP Geolocation by DB-IP</a></footer></main></body></html>
