name: Verify TACO cinema
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Tests and deployment configuration
        run: |
          python -m unittest discover -s tests -v
          for file in static/*.js; do node --input-type=module --check < "$file"; done
          bash -n deploy.sh
          bash -n scripts/deploy_stack.sh
          bash -n scripts/reload_caddy.sh
          bash deploy.sh --check --domain video.taco.net --direct
          tmp="$(mktemp)"
          printf '%s\n' 'DOMAIN=video.taco.net' 'HONGGUO_NETWORK_MODE=direct' > "$tmp"
          docker compose --project-directory "$PWD" --env-file "$tmp" -f compose.yaml config --quiet
          printf '%s\n' 'DOMAIN=video.taco.net' 'HONGGUO_NETWORK_MODE=direct' \
            'TACO_HTTP_PUBLISH=127.0.0.1:18080:80' 'TACO_HTTPS_PUBLISH=8443:443' \
            'TACO_HTTPS_UDP_PUBLISH=8443:443/udp' 'TACO_PUBLIC_PORT=:8443' \
            'TACO_CADDYFILE=./deploy/Caddyfile.tls' 'TACO_CERT_DIR=./deploy/certs' \
            'HONGGUO_PUBLIC_URL=https://video.taco.net:8443' > "$tmp"
          docker compose --project-directory "$PWD" --env-file "$tmp" -f compose.yaml config --quiet
          rm -f "$tmp"
      - name: Build from installer permissions (umask 077)
        run: |
          umask 077
          git clone --quiet --no-hardlinks . "$RUNNER_TEMP/taco-private-context"
          test "$(stat -c %a "$RUNNER_TEMP/taco-private-context/server.py")" = 600
          test "$(stat -c %a "$RUNNER_TEMP/taco-private-context/static")" = 700
          docker build -t taco-cinema:ci "$RUNNER_TEMP/taco-private-context"
      - name: Start production-configured container
        run: |
          docker network create taco-ci
          docker run --detach --name taco-smoke \
            --network taco-ci --network-alias web \
            --volume taco-ci-data:/data \
            --env HONGGUO_ENV=production \
            --env HONGGUO_PUBLIC_URL=https://cinema.invalid \
            --env HONGGUO_ALLOWED_HOSTS=cinema.invalid,127.0.0.1,localhost \
            --env HONGGUO_NETWORK_MODE=direct \
            --env FORWARDED_ALLOW_IPS='*' taco-cinema:ci
          docker exec taco-smoke python scripts/smoke_container.py http://127.0.0.1:8787
          docker exec taco-smoke python -c "import os; assert os.getuid() == 10001"
      - name: Restart with the existing data volume
        run: |
          docker exec taco-smoke python -c "from pathlib import Path; Path('/data/keep-on-restart').write_text('preserved')"
          docker restart taco-smoke
          docker exec taco-smoke python scripts/smoke_container.py http://127.0.0.1:8787
          docker exec taco-smoke python -c "from pathlib import Path; assert Path('/data/keep-on-restart').read_text() == 'preserved'"
      - name: Validate Caddy configuration
        run: |
          docker run --rm --env DOMAIN=cinema.invalid \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --env DOMAIN=cinema.invalid \
            --volume "$PWD/deploy/Caddyfile.alpn:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          cert_dir="$RUNNER_TEMP/taco-caddy-certs"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/privkey.pem" -out "$cert_dir/fullchain.pem" \
            -days 1 -subj '/CN=cinema.invalid'
          docker run --rm --env DOMAIN=cinema.invalid --env TACO_PUBLIC_PORT=:8443 \
            --volume "$PWD/deploy/Caddyfile.tls:/etc/caddy/Caddyfile:ro" \
            --volume "$cert_dir:/certs:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify country blocking and real Caddy forwarding
        run: |
          docker run --detach --name taco-proxy --network taco-ci \
            --env DOMAIN=http://:8080 \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          docker exec taco-smoke python scripts/smoke_country.py http://taco-proxy:8080
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs taco-smoke 2>/dev/null || true
          docker logs taco-proxy 2>/dev/null || true
      - name: Clean up smoke container
        if: always()
        run: |
          docker rm -f taco-smoke taco-proxy 2>/dev/null || true
          docker network rm taco-ci 2>/dev/null || true
          docker volume rm taco-ci-data 2>/dev/null || true
